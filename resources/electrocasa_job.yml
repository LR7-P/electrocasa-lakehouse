# Job de orquestación:
#   copy_into_bronze  (notebook) ─┐
#                                 ├─> pipeline_principal (pipeline) ─> validacion (notebook)
#   ingesta_tracking  (pipeline) ─┘
# La ingesta de Tracking y el pipeline principal van en secuencia (Free Edition: 1 pipeline activa por tipo).
resources:
  jobs:
    electrocasa_job:
      name: electrocasa_job_${bundle.target}
      max_concurrent_runs: 1

      # Disparo por llegada de archivo: los lotes llegan sin calendario fijo
      trigger:
        pause_status: ${var.trigger_pausa}
        file_arrival:
          url: /Volumes/${var.catalogo}/default/vol_landing/
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 120

      email_notifications:
        on_failure:
          - ${var.email_alertas}
        on_success:
          - ${var.email_alertas}
        no_alert_for_skipped_runs: true

      tasks:
        - task_key: copy_into_bronze
          description: COPY INTO de catálogo y sucursales (fuentes de snapshot / referencia)
          notebook_task:
            notebook_path: ../notebooks/01_copy_into.ipynb
            base_parameters:
              catalogo: ${var.catalogo}
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800

        - task_key: ingesta_tracking
          description: Conector query-based de SQL Server (Lakeflow Connect) -> bronze.tracking_envios
          pipeline_task:
            pipeline_id: ${var.tracking_pipeline_id}
          max_retries: 2
          min_retry_interval_millis: 120000
          timeout_seconds: 3600

        - task_key: pipeline_principal
          description: Bronze (Auto Loader) + Silver + Gold
          depends_on:
            - task_key: copy_into_bronze
            - task_key: ingesta_tracking
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa_pipeline.id}
            full_refresh: false
          max_retries: 1
          min_retry_interval_millis: 120000
          timeout_seconds: 3600

        - task_key: validacion
          description: Conteos de Silver/Gold, rechazos por fuente y falla si Gold queda vacío
          depends_on:
            - task_key: pipeline_principal
          notebook_task:
            notebook_path: ../notebooks/02_validacion.ipynb
            base_parameters:
              catalogo: ${var.catalogo}
          max_retries: 0
          timeout_seconds: 900
